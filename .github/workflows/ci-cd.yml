name: CI/CD
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: samueldr/nix-build-action@7ea8cf71ec84c6510a7a6660214bc7ee99297dc2 # latest
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            mv result trident-tweaks.jar
            gh release create ${{ github.ref_name }} \
              trident-tweaks.jar \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
