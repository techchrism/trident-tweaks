name: TridentTweaks
version: ${version}
main: me.techchrism.tridenttweaks.TridentTweaks
author: Techdoodle
api-version: 26.2
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.4.10
commands:
  tridenttweaks:
    description: Command to check version or reload the config
    usage: /tridenttweaks reload
    permission: tridenttweaks.cmd
permissions:
  tridenttweaks.cmd:
    default: op
  tridenttweaks.reload:
    default: op